[project]
name = "shenzen-ai"
version = "0.1.0"
description = "AI service"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx2>=2.13.1",
    "chromadb>=1.5.9",
]

[project.optional-dependencies]
rag = [
    "boto3>=1.43.114",
    "ipykernel>=7.4.0",
    "llama-index-core>=0.14.25",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

# CPU-only torch on Linux keeps the container image small (the default wheel bundles CUDA)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
# prompt/regex literals read better unwrapped; the SQL interpolates only module constants
"src/features/advisor_chat/**" = ["E501"]
"src/domain/advisor_chat/**" = ["E501"]
"src/infrastructure/advisor_chat/**" = ["E501", "S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
